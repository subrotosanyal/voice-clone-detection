# Satya-Vani — Live Call Path
#
#   docker compose up --build
#
# Then:
#   curl -F "file=@services/live-call-api/samples/genuine_tone.wav" \
#        http://localhost:8020/v1/score/file | jq
#
#   open http://localhost:8020/docs      (interactive API docs)
#   open http://localhost:8888           (Dozzle — central log viewer)
#
# Host port is 8020, not the more obvious 8000 — chosen to avoid clashing
# with other projects' containers on a shared dev machine. Change the left
# side of "8020:8000" below if 8020 is taken on your machine too; the
# container's own port (right side, 8000) never needs to change.
#
# See docs/running-locally.md for the full walkthrough.

services:
  live-call-api:
    build:
      context: ./services/live-call-api
      # Optional: set HF_TOKEN in your shell before running
      # `docker compose build`/`up --build` for faster, authenticated
      # HuggingFace Hub downloads during the ECAPA/intent-classifier/
      # Phi-3-GGUF fetch steps (see the Dockerfile's own HF_TOKEN note).
      # `environment:` here means "read this secret's VALUE from the
      # host env var of the same name at build time" — nothing is ever
      # written to disk or baked into an image layer either way; safe
      # to leave HF_TOKEN unset, same anonymous behavior as before this
      # existed.
      secrets:
        - hf_token
    ports:
      - "8020:8000"
    environment:
      RISK_CONFIG_PATH: config/risk_formula.yaml
      HISTORY_DB_PATH: data/sessions.db
      LOG_LEVEL: INFO
    volumes:
      # Mount config read-only so editing risk_formula.yaml and restarting
      # (no rebuild) is enough to try a new formula.
      - ./services/live-call-api/config:/app/config:ro
      # Session history AND enrolled voiceprints (both SQLite, both under
      # this one directory — data/sessions.db and data/voiceprints.db) —
      # read-write, and outside the container's own filesystem, so
      # `docker compose up --build` never wipes either one.
      - ./services/live-call-api/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    depends_on:
      # Start-order only, not health-gated: WhisperLive is a raw
      # WebSocket server with no HTTP health endpoint to poll, and
      # app/adapters/transcription/whisperlive_transcriber.py already
      # degrades gracefully (returns an empty transcript, same as every
      # other best-effort adapter here) if it isn't reachable yet on the
      # first live-mic session right after `docker compose up`.
      - whisper-live

  # Real-time transcription backend for the LIVE WebSocket path only
  # (see app/adapters/transcription/whisperlive_transcriber.py and
  # config/risk_formula.yaml's `live_transcription:` section) —
  # collabora/WhisperLive (MIT licensed), faster-whisper/CTranslate2 on
  # CPU. Runs as its OWN process/container specifically so its model
  # inference no longer shares this app's CPU/thread pool with
  # AASIST/Parselmouth/ECAPA on the live per-window path — see
  # live_transcription.py's own docstring for the CPU-contention bug
  # this fixes. POST /v1/score/file (file upload) is unaffected — it
  # keeps using the local `transcription:` Whisper model, since that
  # path was never the one starved for CPU (it transcribes once per
  # call, not every ~4s of a live session).
  #
  # KNOWN LIMITATION, not solved here: the stock whisperlive-cpu image
  # likely doesn't pre-bake "small" model weights, so this container may
  # need network access on its FIRST connection (one-time download,
  # then cached in the container's own filesystem until it's recreated).
  whisper-live:
    image: ghcr.io/collabora/whisperlive-cpu:latest
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Central logging: every container's stdout is already JSON (see
  # app/logging_setup.py) — Dozzle gives a zero-config web UI over
  # `docker logs`, filterable, with no log-shipping infrastructure to run.
  # Swap for Loki+Grafana or ELK later without touching application code;
  # see docs/architecture.md, "Central logging".
  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"  # dozzle listens on 8080 inside the container
    restart: unless-stopped

# Sourced from the HF_TOKEN env var (see live-call-api's own `build.
# secrets:` note above) — a build-time-only BuildKit secret, mounted
# into individual RUN steps in the Dockerfile via
# `--mount=type=secret,id=hf_token,env=...`, never written into any
# image layer. Compose's `environment:` form here means "read the VALUE
# from this host env var", not "the secret's name is this env var".
secrets:
  hf_token:
    environment: HF_TOKEN

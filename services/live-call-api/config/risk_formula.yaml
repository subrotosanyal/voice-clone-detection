# Satya-Vani risk formula — the single file that controls scoring.
#
# Add a new risk factor by adding an entry under `detectors:` that points
# at a class implementing app.ports.detector.DetectorPort. Change the
# formula's balance by editing `weight`. Change the fusion MATH itself
# (not just weights) by pointing `fusion.class` at a different
# app.ports.fusion.FusionPort implementation. No code changes required for
# any of the above — see docs/risk-model.md.
#
# Bump `formula_version` any time this file changes in a way that would
# change past scores if replayed — it's stamped onto every FusedScore and
# every log line so a score can always be tied back to the exact config
# that produced it (see docs/risk-model.md, "Reproducibility").

formula_version: "2026.09.12"

detectors:
  # Real pretrained countermeasure (AASIST, ASVspoof2019 LA, MIT licensed —
  # see app/adapters/detectors/acoustic_aasist.py for what this does and
  # doesn't prove). The checkpoint is fetched separately, not committed to
  # git — see app/adapters/detectors/vendor/fetch_checkpoint.py.
  #
  # finetuned_out_layer_path (added 2026-09-08): a small, in-house-produced
  # recalibration of just AASIST's final classification layer for Hindi —
  # see eval/indian_language/README.md for the full reproducible process
  # and the honest before/after numbers (this recalibration cut the
  # false-positive rate on real, held-out Hindi speech from 75% to 20%).
  # Omit this line to run the original, un-recalibrated checkpoint.
  #
  # To fall back to the dependency-light DSP heuristic instead (no torch,
  # no checkpoint download — useful for a quick local run), swap the two
  # lines below for:
  #   class: app.adapters.detectors.acoustic_spectral_flatness:SpectralFlatnessDetector
  #   params: {scale: 1.0, floor_rms: 0.0001}
  - name: acoustic
    class: app.adapters.detectors.acoustic_aasist:AasistAcousticDetector
    weight: 0.6
    params:
      checkpoint_path: app/adapters/detectors/vendor/checkpoints/AASIST.pth
      finetuned_out_layer_path: app/adapters/detectors/vendor/checkpoints/AASIST_hindi_finetuned_out_layer.pth
      floor_rms: 0.0001

  - name: prosodic
    # Real Praat-derived jitter/shimmer/HNR (see
    # app/adapters/detectors/prosody_parselmouth.py) — still a heuristic
    # score mapping, honestly documented in that file's docstring.
    #
    # To fall back to the dependency-light autocorrelation heuristic
    # instead (no Praat), swap the two lines below for:
    #   class: app.adapters.detectors.prosody_pitch_variance:PitchVarianceDetector
    #   params: {frame_ms: 40, hop_ms: 20, scale: 2.5}
    class: app.adapters.detectors.prosody_parselmouth:ParselmouthProsodyDetector
    weight: 0.2
    params:
      floor_rms: 0.0001

  - name: third_signal
    class: app.adapters.detectors.third_signal_router:ThirdSignalRouter
    weight: 0.2
    params:
      # contextual | consistency | auto — see docs/risk-model.md
      mode: auto
      contextual_class: app.adapters.detectors.contextual_rules:ContextualRulesDetector
      # Real ECAPA-TDNN voiceprint comparison (see
      # app/adapters/detectors/voiceprint_consistency.py) — abstains until
      # an identity is enrolled via POST /v1/enroll. To fall back to the
      # always-abstaining stub instead (no speechbrain dependency), swap
      # the two lines below for:
      #   consistency_class: app.adapters.detectors.consistency_stub:ConsistencyStubDetector
      #   consistency_params: {}
      consistency_class: app.adapters.detectors.voiceprint_consistency:VoiceprintConsistencyDetector
      consistency_params:
        enrollment_db_path: data/voiceprints.db

  - name: intent
    # Zero-shot NLI classification of the transcript against fraud-relevant
    # candidate labels (see app/adapters/detectors/intent_risk.py and
    # app/adapters/intent/zero_shot_intent_classifier.py) — real MIT-licensed
    # model, confirmed ungated, real Hindi coverage via XNLI.
    #
    # KNOWN LIMITATION, enabled anyway at explicit user instruction: a real
    # calibration check found this model misclassifies completely ordinary
    # conversation as fraud-relevant under three configurations tried (see
    # zero_shot_intent_classifier.py's HONESTY NOTE for the exact numbers).
    # Weighted low (0.15, auto-renormalised against the others — see
    # app/adapters/fusion/weighted_sum.py) precisely because this signal is
    # not yet trusted as much as acoustic/prosodic/third_signal. Abstains
    # entirely when no transcript is available.
    class: app.adapters.detectors.intent_risk:IntentRiskDetector
    weight: 0.15
    params: {}

  - name: perth_watermark
    # Checks for Resemble AI's Perth neural watermark (MIT licensed, see
    # app/adapters/detectors/perth_watermark.py) — a narrow, high-
    # precision signal: Chatterbox and other Perth-integrated voice-
    # cloning tools embed this in every clip they generate. Verified by
    # hand: genuine speech and a DIFFERENT non-Perth TTS system (XTTS-v2)
    # both read near-zero; a clip actually run through Perth's own
    # watermarker reads 1.0. Weighted low (0.15, same as intent, auto-
    # renormalised) because its real-world scope is narrow — it only
    # catches watermark-compliant tools, silence from it never means
    # "this audio is safe". Known false-positive edge case on non-speech
    # audio (a pure tone) — see that module's own HONESTY NOTE.
    class: app.adapters.detectors.perth_watermark:PerthWatermarkDetector
    weight: 0.15
    params:
      floor_rms: 0.0001

  - name: phase_incoherence
    # STFT phase-coherence — a CPU-cheap complement to AASIST, added
    # 2026-09-09 (see app/adapters/detectors/acoustic_phase_incoherence.py
    # for the full VERIFIED BY HAND writeup and docs/risk-model.md,
    # "Phase incoherence check" for the summary). Real, measured effect
    # against this project's own eval/indian_language/ corpus (resampled
    # to a common 16kHz — an earlier sample-rate mismatch produced
    # spurious huge numbers, since fixed and documented in that module):
    # moderate against XTTS-v2 (Cohen's d=0.70, AUC=0.68), strong against
    # HELD-OUT Chatterbox (d=2.56, AUC=0.96, never used to calibrate this).
    #
    # Weighted lower than perth_watermark/intent (0.10 vs. 0.15) precisely
    # because it's weaker against XTTS-v2 specifically and newer/less
    # cross-checked than either — a real, additive, but modest signal, not
    # a strong standalone one. See that module's HONESTY NOTE before
    # raising this weight.
    class: app.adapters.detectors.acoustic_phase_incoherence:PhaseIncoherenceDetector
    weight: 0.10
    params:
      floor_rms: 0.0001

  - name: semantic_risk
    # A local, CPU-only LLM (Microsoft's Phi-3-mini-4k-instruct, MIT
    # licensed, confirmed ungated — see app/adapters/semantic_risk/
    # local_llm_semantic_classifier.py) reading the transcript for
    # social-engineering tactics: manufactured urgency, financial
    # solicitation, authority claims, AND isolation requests ("don't hang
    # up", "don't tell anyone") — a signal neither `intent` above nor
    # the keyword-based contextual rules currently capture at all.
    #
    # REAL, MEASURED evidence before enabling (2026-09-09), not an
    # assumed improvement: run by hand against the exact sentence
    # `intent`'s own zero-shot classifier is documented to misjudge
    # ("are we still on for dinner tonight?" -> 38.9% "creating urgency"
    # there) — this classifier correctly scored it urgency_level=0.0,
    # every flag false. Also correctly identified two real scam scripts
    # (an OTP-phishing script, a bank-impersonation + isolation script),
    # including the isolation tactic in the second one. Still only a
    # handful of examples, not a held-out labeled evaluation — weighted
    # the same conservative 0.15 as `intent` and `perth_watermark` for
    # that reason, running ALONGSIDE `intent` rather than replacing it
    # (deliberately non-destructive — see this project's own "verify
    # before adopting, don't remove what's working" discipline).
    class: app.adapters.detectors.semantic_risk_detector:SemanticRiskDetector
    weight: 0.15
    params: {}

fusion:
  class: app.adapters.fusion.weighted_sum:WeightedSumFusion
  # EMA smoothing across a session's windows: higher = more reactive to the
  # latest window, lower = smoother but slower to react.
  smoothing_alpha: 0.35

bands:
  low_max: 34
  elevated_max: 69
  # anything above elevated_max is "high"

windowing:
  window_ms: 2000
  hop_ms: 500

# Optional — powers POST /v1/score/file's `diarize=true` option (file-upload
# path only, see app/ports/diarizer.py's scope note). Omit this whole
# section to disable diarization entirely without touching any other code.
diarization:
  class: app.adapters.diarization.embedding_cluster_diarizer:EmbeddingClusterDiarizer
  params:
    # distance_threshold/max_speakers were recalibrated 2026-09-08, twice
    # — an earlier same-day fix moved distance_threshold the WRONG
    # direction (made over-counting worse, confirmed by a real
    # 100+-speaker report) and has been corrected here. Segmentation
    # itself was then changed from a fixed clock (segment_ms) to
    # pause-aware boundaries (see app/adapters/diarization/
    # pause_segmentation.py) — max_segment_ms below is now only a cap for
    # sub-slicing long uninterrupted stretches, not the primary
    # segmentation unit. See the full CALIBRATION HISTORY note in
    # embedding_cluster_diarizer.py's own docstring before changing any
    # of this again.
    max_segment_ms: 2500
    min_segment_ms: 500
    silence_threshold_db: -25.0
    min_silence_s: 0.1
    min_sounding_s: 0.1
    floor_rms: 0.0001
    distance_threshold: 0.4
    max_speakers: 8

# Optional — transcribes each POST /v1/score/file call once (file-upload
# path only, see app/ports/transcriber.py's scope note) and feeds
# urgency/financial-request keyword detection into the contextual third
# signal (app/adapters/detectors/contextual_rules.py). Omit this whole
# section to disable transcription entirely; the contextual detector still
# works from manually-supplied urgency_keywords/is_financial_request.
transcription:
  class: app.adapters.transcription.whisper_transcriber:WhisperTranscriber
  params:
    model_size: small  # "base" was tested and found unreliable for Hindi — see whisper_transcriber.py
    floor_rms: 0.0001

# Feeds the `intent` detector above once per call, same "compute once,
# read many times" pattern as transcription — see Engine.score_call()'s
# docstring. Real MIT-licensed model, confirmed ungated, real Hindi
# coverage via XNLI. KNOWN LIMITATION: a real calibration check found it
# misclassifies completely ordinary conversation as fraud-relevant (see
# app/adapters/intent/zero_shot_intent_classifier.py's HONESTY NOTE for
# the exact numbers) — enabled anyway at explicit user instruction, with
# a deliberately modest weight (see the `intent` detector entry above)
# and full transparency in the dashboard (every candidate label's score
# is shown, not just the winner — see app/ui/app.js's intent-breakdown
# rendering). Omit this whole section to disable intent classification
# entirely; the `intent` detector then simply abstains on every window.
intent_classification:
  class: app.adapters.intent.zero_shot_intent_classifier:ZeroShotIntentClassifier
  params:
    model_name: MoritzLaurer/mDeBERTa-v3-base-mnli-xnli

# Optional — real-time, incremental "who's talking now" for the live
# WebSocket path only (see app/pipeline/live_diarization.py). NOT the
# same feature as `diarization:` above, which partitions a COMPLETE
# recording after the fact and only runs on POST /v1/score/file?diarize=true.
# Omit this whole section to disable live diarization entirely; every
# window's `live_speaker` field then stays null, same "omit to disable"
# shape as transcription/intent_classification above. No `class:` here —
# unlike a DetectorPort/DiarizerPort, LiveSpeakerTracker isn't (yet) a
# swappable port, just a config-tunable class; see that module's own
# docstring for why, and its CALIBRATION HONESTY NOTE before changing
# similarity_threshold/ema_alpha without real labeled multi-speaker data.
live_diarization:
  params:
    embedding_model_source: speechbrain/spkrec-ecapa-voxceleb
    floor_rms: 0.0001
    similarity_threshold: 0.75
    ema_alpha: 0.1
    max_speakers: 8

# Feeds the `semantic_risk` detector above once per call, same "compute
# once, read many times" pattern as transcription/intent_classification
# — see Engine.score_call()'s docstring. Real MIT-licensed model
# (Microsoft's Phi-3-mini-4k-instruct GGUF), confirmed ungated, runs
# entirely locally (CPU-only, no external API call at runtime) via
# llama-cpp-python. See app/adapters/semantic_risk/
# local_llm_semantic_classifier.py's own HONESTY NOTE for what's
# verified and what isn't before changing model_path/n_ctx/max_tokens.
# Omit this whole section to disable semantic risk classification
# entirely; the `semantic_risk` detector then simply abstains on every
# window, same as `intent` does when intent_classification is omitted.
semantic_risk_classification:
  class: app.adapters.semantic_risk.local_llm_semantic_classifier:LocalLLMSemanticClassifier
  params:
    model_path: app/adapters/semantic_risk/.cache/Phi-3-mini-4k-instruct-q4.gguf
    # n_ctx MUST match (or exceed) the class's own default — REAL BUG
    # found 2026-09-09: this was left at 1024 after the class default
    # was raised to 4096 to fix a real transcript overflowing the
    # window, so the config value silently overrode the fix and kept
    # the bug alive (the try/except fallback masked it as a graceful
    # abstain instead of a crash, which is how it was caught). Explicit
    # here on purpose, as a reminder to keep the two in sync — see
    # local_llm_semantic_classifier.py's own REAL BUG note.
    n_ctx: 4096
    max_tokens: 150

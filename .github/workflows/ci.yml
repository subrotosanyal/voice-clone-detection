# CI for Satya-Vani's live-call-api — see docs/testing.md and
# docs/running-locally.md for what these jobs mirror locally.
#
# `test-unit`: `pytest tests/unit -v` — the FAST job, gates every PR.
# `test-integration`: `pytest tests/integration -v`, SHARDED across 4
# matrix jobs (2026-09-10) — the SLOW job, split out from a single "test"
# job on 2026-09-10 after a real CI run got CANCELLED at the previous
# 45-minute timeout having completed only 8 of 187 tests (see
# docs/testing.md's "Continuous integration" section for the full honest
# accounting): every one of the 25+ `with TestClient(app) as client:`
# blocks across tests/integration/ reloads FIVE real models (AASIST,
# Whisper, ECAPA-TDNN — twice, once each for diarization and live
# diarization — the zero-shot intent classifier, and a ~2.4GB local LLM)
# from scratch, 3-4 real minutes per test on a GitHub-hosted runner. Unit
# tests mostly use fakes/mocks for exactly this reason, and the handful
# that DO load a real model do so via a session-scoped fixture (loaded
# once for the whole run, not once per test) — genuinely a different cost
# class, which is why the fast/slow split is drawn at the tests/unit vs.
# tests/integration boundary rather than by individual test file. The
# shard grouping below is a reasonable first split by test COUNT, not a
# measured-optimal one — rebalance it once real per-shard CI timings are
# available (see each shard's own comment for today's guess).
#
# `docker-compose-build`: builds the actual image `docker compose build`
# would, then starts the real stack and scores a real sample file through
# it — proving the committed Dockerfile/docker-compose.yml combo still
# works end to end, not just that `pytest` passes outside Docker. See
# that job's own 2026-09-11 REAL BUG note for why this is a PLAIN
# `docker compose build` rather than a cached one via
# docker/build-push-action — briefly tried, reverted with real CI
# evidence in hand.
name: CI

# DISABLED 2026-09-10 (out of GitHub-hosted runner minutes): automatic
# push/pull_request triggers commented out below — nothing runs on
# GitHub Actions until they're restored. `workflow_dispatch` is kept so
# this can still be run manually (Actions tab -> CI -> "Run workflow")
# on the rare occasion runner minutes are available again. Everything
# this workflow does mirrors a local command 1:1 — see docs/testing.md
# ("pytest tests/unit -v" / "pytest tests/integration -v") and
# docs/running-locally.md ("docker compose build/up") — run those
# locally instead; this is not a reduction in what gets verified, just
# where.
on:
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-unit:
    name: Run unit tests (fast)
    runs-on: ubuntu-latest
    # Generous over the observed local runtime (well under 5 minutes even
    # cold), not a tight bound — this job's whole point is fast PR
    # feedback, so a real regression here should fail loudly, not time out.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/live-call-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/live-call-api/requirements-dev.txt

      # Matches docs/testing.md's "Common errors" note: the soundfile wheel
      # doesn't reliably bundle libsndfile on every platform.
      - name: Install libsndfile
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1

      # Same reasoning as the Dockerfile's own torch/torchaudio install
      # step: a plain `pip install torch` on Linux resolves the CUDA
      # build, which drags in ~2GB of nvidia_*/cublas/cusolver this
      # CPU-only CI runner never uses. Installed first so the plain
      # torch==.../torchaudio==... lines in requirements.txt are already
      # satisfied and pip skips them below — keep this pinned to the same
      # version as services/live-call-api/Dockerfile and requirements.txt.
      - name: Install CPU-only torch/torchaudio
        run: pip install torch==2.11.0+cpu torchaudio==2.11.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # AASIST checkpoint, ECAPA-TDNN, and Whisper "small" — a handful of
      # unit tests load these once each via a session-scoped conftest.py
      # fixture (skips gracefully if unavailable, e.g. offline). NOT the
      # ~2.4GB Phi-3-mini semantic-risk LLM: that one's own real-model
      # tests (test_local_llm_semantic_classifier.py's `real_classifier`
      # fixture) are the only unit tests that need it, and this job
      # deliberately doesn't pay that ~6min llama-cpp-python build + ~6min
      # download cost — those specific tests skip here (see that
      # fixture's own REAL BUG note — it used to error instead of
      # skipping cleanly, fixed 2026-09-10) and run for real in
      # test-integration below, which already needs the full model set.
      - name: Cache pretrained models
        uses: actions/cache@v4
        with:
          path: |
            services/live-call-api/app/adapters/detectors/vendor/checkpoints
            services/live-call-api/app/adapters/embeddings/.cache
            services/live-call-api/app/adapters/transcription/.cache
            services/live-call-api/app/adapters/intent/.cache
          key: satya-vani-models-unit-v1

      - name: Run unit tests
        run: pytest tests/unit -v

  test-integration:
    # Sharded 2026-09-10 (see this file's own top-of-file note for why,
    # and #5 in the CI performance discussion this implements). GitHub
    # auto-suffixes the job name with the matrix value, e.g. "Run
    # integration tests (slow) (api-and-ui)".
    name: Run integration tests (slow)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Grouped by test COUNT for a roughly even first split (27 tests
        # / 4 shards), not by measured per-file timing — rebalance once
        # real shard durations are visible in the Actions UI. Add a new
        # test file's name to whichever shard's `case` arm below it
        # semantically belongs with, or start a new shard if one group
        # gets consistently slow.
        shard: [api-and-ui, diarization-and-enrollment, history-and-live-transcription, live-diarization]
    # Scaled down from the old single-job 150min (sized for all 27 tests
    # sequentially) now that each shard only runs ~7 tests — generous
    # headroom over the ~3-4 real min/test previously observed, not a
    # tight bound.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/live-call-api
    steps:
      - uses: actions/checkout@v4

      # See docker-compose-build's own "Free disk space" step for the
      # full rationale — added here too because the live-diarization
      # shard is the one that actually hit it: a real CI run (2026-09-11)
      # SIGABRT'd (exit 134) ~3 minutes after pytest's own tests had
      # already finished, coinciding with a runner disk-space warning
      # ("Free space left: 91 MB"). See app/api/ws_router.py's own
      # 2026-09-11 REAL BUG note for the other, complementary half of
      # this fix (bounding the background hangup-diarization work
      # itself, not just freeing more disk for it to spend).
      - name: Free disk space (unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/live-call-api/requirements-dev.txt

      - name: Install libsndfile
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1

      - name: Install CPU-only torch/torchaudio
        run: pip install torch==2.11.0+cpu torchaudio==2.11.0+cpu --index-url https://download.pytorch.org/whl/cpu

      # See #2 in the CI performance discussion this implements: plain
      # `pip install` for llama-cpp-python (part of requirements-dev.txt
      # below) BUILDS IT FROM SOURCE — measured at 6m18s in a real CI run
      # (no prebuilt wheel resolves for this Python/OS combo). Building it
      # ONCE into a wheelhouse dir, cached by a hash of the requirement
      # files, means `pip install --find-links wheelhouse` below reuses
      # the cached wheel instead of recompiling whenever requirements
      # haven't changed. Shared across all 4 shards via the same cache
      # key — on a cold cache (a real dependency bump) all 4 will each
      # independently pay the build cost once in parallel, a real but
      # rare and accepted trade-off against the complexity of a separate
      # coordinating "prepare" job just to avoid that.
      - name: Cache built wheels (llama-cpp-python)
        id: wheel-cache
        uses: actions/cache@v4
        with:
          path: services/live-call-api/wheelhouse
          key: satya-vani-wheelhouse-${{ runner.os }}-py3.12-${{ hashFiles('services/live-call-api/requirements-dev.txt', 'services/live-call-api/requirements.txt') }}

      - name: Build llama-cpp-python wheel (cache miss only)
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: pip wheel --no-cache-dir --wheel-dir wheelhouse llama-cpp-python==0.3.35

      - name: Install Python dependencies
        run: pip install --find-links wheelhouse -r requirements-dev.txt

      # AASIST checkpoint, ECAPA-TDNN, Whisper "small", and the intent
      # classifier — the same real, checksum-or-source-verified,
      # confirmed-ungated models docs/testing.md describes tests/conftest.py's
      # fixtures fetching on first run. Cached here so only the first CI
      # run after this workflow is added (or a model version bump) pays
      # the download cost; bump the cache key below if a model URL/
      # version ever changes. Shared across all 4 shards, same reasoning
      # as the wheel cache above.
      - name: Cache pretrained models
        uses: actions/cache@v4
        with:
          path: |
            services/live-call-api/app/adapters/detectors/vendor/checkpoints
            services/live-call-api/app/adapters/embeddings/.cache
            services/live-call-api/app/adapters/transcription/.cache
            services/live-call-api/app/adapters/intent/.cache
            services/live-call-api/app/adapters/semantic_risk/.cache
          # v3: added the semantic_risk/ cache path (Phi-3-mini-4k-instruct
          # GGUF, ~2.4GB) — bumped so a fresh cache entry gets created that
          # actually includes it; the old v2 key's saved archive predates
          # that path and would never populate it.
          key: satya-vani-models-v3

      # REAL BUG found and fixed 2026-09-09: unlike AASIST/ECAPA/Whisper/
      # intent (each fetched lazily by a conftest.py fixture a SPECIFIC
      # test requests), config/risk_formula.yaml's `semantic_risk_
      # classification:` section means EVERY test that spins up a real
      # TestClient(app) and produces a transcript unconditionally tries
      # to load this model via Engine.score_call() -- with no test
      # explicitly fetching it first. Fetching explicitly here, before any
      # test runs, same as the Dockerfile's own build-time fetch step.
      - name: Fetch local LLM model (Phi-3-mini)
        run: python app/adapters/semantic_risk/fetch_llm_model.py

      # Explicit case arms rather than a lookup table — keeps the file ->
      # shard mapping visible in one place without a second config file.
      # Each `tests/integration/*.py` file must appear in EXACTLY one arm
      # below; a file added to the suite but missing here silently never
      # runs in CI — there's no automated check for that yet.
      - name: Run integration tests (shard ${{ matrix.shard }})
        run: |
          case "${{ matrix.shard }}" in
            api-and-ui)
              FILES="test_api_score_file.py test_transcription_api.py" ;;
            diarization-and-enrollment)
              FILES="test_diarization_api.py test_enrollment_api.py" ;;
            history-and-live-transcription)
              FILES="test_history_api.py test_ui_served.py test_live_transcription_ws.py" ;;
            live-diarization)
              FILES="test_live_diarization_ws.py test_live_diarize_on_hangup_ws.py test_live_per_speaker_fusion_ws.py" ;;
            *)
              echo "unknown shard: ${{ matrix.shard }}" >&2
              exit 1 ;;
          esac
          ARGS=""
          for f in $FILES; do ARGS="$ARGS tests/integration/$f"; done
          pytest $ARGS -v

  docker-compose-build:
    name: Verify docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # REAL BUG found 2026-09-11 (first instance, same day): this job
      # started failing with `buildx failed with: ... failed to copy to
      # tar: rpc error: ... closed pipe` — a BuildKit/buildx I/O error
      # during image export, not a Dockerfile problem. The multi-stage
      # image here already bakes in ~2.4GB+ of models across 3 stages,
      # and GitHub-hosted `ubuntu-latest` runners ship ~30GB of
      # preinstalled toolchains (Android SDK, .NET, Haskell/GHC, CodeQL)
      # this project never uses — removing them reclaims real disk
      # before the build even starts, the standard fix for GitHub
      # Actions runners running low on disk. Kept even after the
      # buildx/GHA-cache approach below was reverted (see this job's
      # OWN, second, 2026-09-11 REAL BUG note): cheap, still generically
      # useful headroom for any Docker build.
      - name: Free disk space (unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # REAL BUG found 2026-09-11 (second instance, same day, AFTER the
      # disk-space fix above and a `cache-to: type=gha,mode=min` change
      # both landed): this job started failing again — this time by
      # exceeding its own 25-minute timeout, ONE STEP after a fully
      # successful build + deploy + healthcheck (confirmed from a real
      # run's log: "service is healthy" printed, then the job was
      # cancelled before "Score a sample file" could even start).
      #
      # Real CI log evidence (run 34360116992) found TWO compounding,
      # now-understood problems with the docker/build-push-action +
      # `type=gha` cache approach this job used to use:
      #
      # 1. mode=min was the WRONG fix for the disk-space problem above:
      #    it only exports layers that land in the FINAL image — but
      #    this Dockerfile's two most expensive steps, the
      #    parselmouth-builder and llm-builder stages' own from-source
      #    wheel compiles, are BUILDER-STAGE-ONLY layers (their layers
      #    are discarded; only the OUTPUT wheel files get
      #    `COPY --from=`'d into the final stage). mode=min never cached
      #    them, so EVERY run recompiled llama-cpp-python from source —
      #    measured at 396s (6.6 minutes) in that log, right alongside
      #    parselmouth's own from-source build. The comment this
      #    replaced claimed those builds "land in the final stage" —
      #    that was WRONG; only their output artifacts do, not the
      #    compile steps' own cacheable layers.
      # 2. Independent of caching mode entirely: `docker/build-push-
      #    action` with `load: true` on the ISOLATED `docker-container`
      #    buildx builder (the driver `docker/setup-buildx-action` sets
      #    up) must export the ENTIRE built image — multi-GB, given the
      #    5 baked-in models — to a tarball and re-import it into the
      #    local Docker daemon before `docker compose up -d` can use it.
      #    Measured at ~14 minutes (`exporting layers` + `sending
      #    tarball` + `importing to docker`) in that same run,
      #    REGARDLESS of whether anything else cache-hit. This tax is
      #    structural to using a remote/isolated builder + `load: true`
      #    — no cache-mode tweak fixes it.
      #
      # Combined: a from-scratch build (#1's lost ~7 minutes) plus the
      # ~14-minute hand-off tax (#2), stacked on top of the rest of the
      # build, landed at ~24.5 minutes total — just past the finish line
      # of the 25-minute budget.
      #
      # FIX: dropped buildx/GHA-cache entirely for this job, back to a
      # PLAIN `docker compose build`. Modern Docker still uses BuildKit
      # under the hood by default even without an explicit `docker
      # buildx` builder, so the multi-stage Dockerfile itself is
      # unaffected — but the default driver builds directly into the
      # local daemon's own image store, with no separate builder
      # process and therefore no export/import hand-off to pay at all.
      # Trade-off, accepted deliberately: every run now pays the FULL
      # from-scratch build cost — no cross-run layer caching. Measured
      # against that same log's own timestamps, that's ~10-11 minutes
      # of build compute (including the llama-cpp-python/parselmouth
      # compiles) + ~1 minute for the 5 model fetches + ~1-2 minutes for
      # up/healthcheck/score — a consistent ~13-14 minutes EVERY run,
      # comfortably under the 25-minute budget, and actually FASTER than
      # the cached approach's own worst case (~24.5min) or even its best
      # plausible case (a full cache hit would still pay the ~14min
      # export/import tax alone). Simpler too: two fewer external
      # actions, no cache-mode trade-off left to keep re-litigating.
      # HF_TOKEN — optional, see docker-compose.yml's own `secrets:`
      # block and the Dockerfile's HF_TOKEN note for the full mechanism.
      # Safe if the repo secret below is never created: GitHub Actions
      # resolves an undefined `secrets.*` reference to an empty string,
      # and huggingface_hub treats an empty HF_TOKEN as no-token
      # (confirmed against its own source) — same anonymous-request
      # behavior this job already had.
      - name: Build live-call-api image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_VOICE_CLONE_DETECT_CI }}
        run: docker compose build

      - name: docker compose up
        run: docker compose up -d

      # Same healthcheck docker-compose.yml already defines for the
      # container itself (see its `healthcheck:` block) — polled from the
      # host side here since `docker compose up -d` returns as soon as the
      # container starts, not once it's actually ready to serve.
      - name: Wait for the service to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8020/healthz; then
              echo "service is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "service never became healthy within the timeout" >&2
          exit 1

      # The same curl command README.md's Quickstart documents — proves
      # the built image can actually score real audio end to end, not
      # just that the container started.
      - name: Score a sample file end to end
        run: |
          curl -sf -F "file=@services/live-call-api/samples/genuine_tone.wav" \
               http://localhost:8020/v1/score/file | python3 -m json.tool

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
